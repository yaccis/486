<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 - AI 演示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header class="top-bar">
      <div><h1>2048</h1></div>
      <div class="score-panel">
        <div class="score-box"><span class="label">分数</span><span id="score">0</span></div>
        <div class="score-box"><span class="label">最佳</span><span id="best-score">0</span></div>
      </div>
    </header>

    <div class="action-row">
      <p>合并数字，得到 2048！</p>
      <div class="buttons">
        <button id="new-game-btn" type="button">新游戏</button>
        <button id="ai-demo-btn" type="button">AI开始演示</button>
      </div>
    </div>

    <div id="ai-info" class="ai-info hidden">
      <div id="ai-step-text">AI准备中</div>
      <div id="ai-direction-text">…</div>
    </div>

    <div id="board" class="board" aria-label="2048 game board"></div>
    <div id="message" class="message hidden" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
